[package]
name = "rutracker-ocr"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "rutracker-ocr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
# Classification only. The ONNX file is supplied by GitHub Actions, not downloaded at runtime.
ddddocr-tract = { version = "0.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
